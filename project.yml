name: WanShouJian
options:
  bundleIdPrefix: com.magiicccc
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WanShouJian:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources]
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 万兽共鸣
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 用于连接你选择的宝宝剑，并调节颜色与亮度。
        NSMicrophoneUsageDescription: 用于在本机实时分析外放音乐的节奏，驱动宝宝剑和白狐光效；声音仅在内存中处理。
        NSSpeechRecognitionUsageDescription: 用于本机识别当前唱到的歌词，辅助自动对齐；原始声音在本机处理。
        UIBackgroundModes: [audio, bluetooth-central]
        UIAppFonts: [WSJDisplay-ExtraLight.otf]
        KnownDeviceMACSHA256: $(LIGHTSTICK_MAC_SHA256)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magiicccc.wanshoujian
        LIGHTSTICK_MAC_SHA256: ""
        MARKETING_VERSION: 0.4.2
        CURRENT_PROJECT_VERSION: 10
        SWIFT_OBJC_BRIDGING_HEADER: App/BridgingHeader.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  WanShouJianTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WanShouJian
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.magiicccc.wanshoujian.tests
  WanShouJianUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WanShouJian
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.magiicccc.wanshoujian.uitests
schemes:
  WanShouJian:
    build:
      targets:
        WanShouJian: all
        WanShouJianTests: [test]
        WanShouJianUITests: [test]
    test:
      gatherCoverageData: true
      targets: [WanShouJianTests, WanShouJianUITests]
